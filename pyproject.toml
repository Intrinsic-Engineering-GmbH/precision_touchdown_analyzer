[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "touchdown-analyzer"
version = "0.1.0"
description = "Video-based landing accuracy measurement for glider spot-landing competitions"
readme = "README.md"
# 3.12+ because numpy 2.5 (used by the calibration solver) requires it.
# The capture side alone is stdlib-only and would still run on 3.10.
requires-python = ">=3.12"
authors = [{ name = "Intrinsic Engineering GmbH" }]
dependencies = ["numpy>=2.0"]

[project.scripts]
touchdown-analyzer = "touchdown_analyzer.cli:main"

[project.optional-dependencies]
# The control UI. The recorder itself stays stdlib-only, so `record` keeps
# working even if this is not installed.
ui = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
touchdown_analyzer = ["control/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["touchdown_analyzer"]
mypy_path = "src"
warn_unused_ignores = true
warn_return_any = true
